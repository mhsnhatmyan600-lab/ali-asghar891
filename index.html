<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فروشگاه ذوالفقار | فروشگاه معنوی</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Vazirmatn', 'sans-serif'] },
                    colors: { dk: { red: '#ef4056', dark: '#3f4064', gray: '#f0f0f1', text: '#62666d' } }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Vazirmatn', sans-serif; background-color: #f5f5f5; color: #3f4064; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .scrollbar-none::-webkit-scrollbar { display: none; }
        .modal-bg { background-color: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); }
    </style>
</head>
<body class="antialiased flex flex-col min-h-screen">

    <!-- هدر -->
    <header class="bg-white shadow-sm sticky top-0 z-40 border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-2">
            <div class="flex items-center gap-2">
                <div class="text-dk-red font-black text-2xl sm:text-3xl tracking-tighter flex items-center gap-2">
                    <i class="fa-solid fa-shield-halved"></i> ذوالفقار
                </div>
            </div>

            <div class="flex-1 max-w-xl relative hidden sm:block">
                <input type="text" id="searchInput" oninput="handleSearch()" placeholder="جستجو در محصولات معنوی..." 
                       class="w-full bg-[#f0f0f1] border-none rounded-lg py-2.5 pr-11 pl-4 text-sm focus:outline-none focus:ring-2 focus:ring-dk-red/20 transition">
                <i class="fa-solid fa-magnifying-glass absolute right-4 top-3.5 text-gray-400"></i>
            </div>

            <div class="flex items-center gap-2 sm:gap-4">
                <button onclick="openRegisterModal()" class="flex items-center gap-2 border border-gray-300 px-2 sm:px-4 py-2 rounded-lg text-xs sm:text-sm hover:bg-gray-50 transition">
                    <i class="fa-regular fa-user text-gray-500"></i>
                    <span>ورود | ثبت نام</span>
                </button>
                <button onclick="toggleCartDrawer()" class="relative p-2 rounded-lg hover:bg-gray-100 transition">
                    <i class="fa-solid fa-cart-shopping text-xl text-gray-600"></i>
                    <span id="cartBadge" class="hidden absolute top-0 right-0 bg-dk-red text-white text-[10px] font-bold w-4 h-4 rounded-full items-center justify-center">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- بنر -->
    <section class="max-w-7xl mx-auto px-4 py-4 w-full">
        <div class="bg-gradient-to-l from-dk-red to-red-600 rounded-2xl p-6 sm:p-10 text-white flex items-center justify-between shadow-lg">
            <div class="space-y-2 text-center sm:text-right w-full sm:w-auto">
                <h1 class="text-xl sm:text-3xl font-bold">فروشگاه معنوی ذوالفقار</h1>
                <p class="text-red-100 text-xs sm:text-sm">مرجع تخصصی محصولات مذهبی و فرهنگی با ضمانت اصالت</p>
            </div>
        </div>
    </section>

    <!-- دسته بندی‌ها -->
    <section class="max-w-7xl mx-auto px-4 py-2 w-full">
        <div class="bg-white rounded-2xl p-4 flex justify-between items-center overflow-x-auto scrollbar-none gap-6">
            <div class="flex flex-col items-center gap-2 text-xs text-gray-600 hover:text-dk-red cursor-pointer">
                <i class="fa-solid fa-book-quran text-2xl text-gray-400"></i><span>قرآن و کتب</span>
            </div>
            <div class="flex flex-col items-center gap-2 text-xs text-gray-600 hover:text-dk-red cursor-pointer">
                <i class="fa-solid fa-kaaba text-2xl text-gray-400"></i><span>وسایل نماز</span>
            </div>
            <div class="flex flex-col items-center gap-2 text-xs text-gray-600 hover:text-dk-red cursor-pointer">
                <i class="fa-solid fa-ring text-2xl text-gray-400"></i><span>انگشتر و تسبیح</span>
            </div>
            <div class="flex flex-col items-center gap-2 text-xs text-gray-600 hover:text-dk-red cursor-pointer">
                <i class="fa-solid fa-spray-can-sparkles text-2xl text-gray-400"></i><span>عطر و عود</span>
            </div>
            <div class="flex flex-col items-center gap-2 text-xs text-gray-600 hover:text-dk-red cursor-pointer">
                <i class="fa-solid fa-mug-hot text-2xl text-gray-400"></i><span>نذری</span>
            </div>
        </div>
    </section>

    <!-- محصولات -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-lg font-bold">محصولات معنوی</h2>
        </div>
        <div id="productGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 sm:gap-4"></div>
    </main>

    <!-- سبد خرید -->
    <div id="cartDrawer" class="fixed inset-0 z-50 invisible transition-all duration-300">
        <div id="cartOverlay" onclick="toggleCartDrawer()" class="absolute inset-0 bg-black/50 opacity-0 transition-opacity duration-300"></div>
        <div class="absolute inset-y-0 left-0 max-w-full w-80 bg-white shadow-2xl flex flex-col transform -translate-x-full transition-transform duration-300" id="cartPanel">
            <div class="p-4 border-b flex justify-between items-center">
                <h3 class="font-bold">سبد خرید شما</h3>
                <button onclick="toggleCartDrawer()" class="text-gray-400"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div id="cartItems" class="flex-1 overflow-y-auto p-4 space-y-4"></div>
            <div class="p-4 border-t space-y-3">
                <div class="flex justify-between text-sm"><span>مبلغ قابل پرداخت:</span><span id="cartTotalPrice" class="font-bold text-dk-red">۰ تومان</span></div>
                <button onclick="checkout()" class="w-full bg-dk-red text-white font-bold py-2 rounded-lg text-sm">ثبت سفارش</button>
            </div>
        </div>
    </div>

    <!-- مودال ثبت‌نام -->
    <div id="registerModal" class="fixed inset-0 z-50 hidden flex items-center justify-center modal-bg">
        <div class="bg-white rounded-2xl p-6 w-[90%] max-w-sm shadow-2xl relative">
            <button onclick="closeRegisterModal()" class="absolute top-4 left-4 text-gray-400 hover:text-dk-red"><i class="fa-solid fa-xmark text-xl"></i></button>
            <div class="text-center mb-6 mt-2">
                <i class="fa-solid fa-user-circle text-4xl text-dk-red mb-3"></i>
                <h3 class="text-lg font-bold">ورود / ثبت‌نام</h3>
                <p class="text-xs text-gray-500 mt-2">برای ثبت سفارش وارد حساب خود شوید</p>
            </div>
            <form onsubmit="handleRegister(event)">
                <input type="text" id="phoneInput" placeholder="شماره موبایل" class="w-full bg-[#f5f5f5] border border-gray-200 rounded-lg py-2.5 px-3 text-sm mb-4 focus:outline-none focus:border-dk-red focus:bg-white transition text-left" dir="ltr">
                <button type="submit" class="w-full bg-dk-red text-white font-bold py-2.5 rounded-lg text-sm hover:bg-red-600 transition">دریافت کد تایید</button>
            </form>
        </div>
    </div>

    <footer class="bg-white border-t py-6 text-center text-xs text-gray-500">
        <p>© ۱۴۰۳ فروشگاه معنوی ذوالفقار - تمامی حقوق محفوظ است.</p>
    </footer>

    <script>
        // تابع تولید عکس با آیکون‌های گرافیکی
        function getImg(icon) {
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
                <rect width="400" height="400" fill="#f0f0f1"/>
                <text x="200" y="240" font-size="150" text-anchor="middle" fill="#ef4056">${icon}</text>
            </svg>`;
            return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
        }

        // محصولات معنوی
        const products = [
            { id: 1, title: 'قرآن کریم خط عثمان طه', price: 350000, old: 400000, rating: 4.9, reviews: 1200, icon: "📖" },
            { id: 2, title: 'مفاتیح الجنان نفیس', price: 280000, old: 320000, rating: 4.8, reviews: 850, icon: "📕" },
            { id: 3, title: 'تسبیح سنگ یشم اصل', price: 450000, old: 550000, rating: 4.7, reviews: 3200, icon: "📿" },
            { id: 4, title: 'جانماز مخمل طرح محراب', price: 380000, old: 420000, rating: 4.6, reviews: 540, icon: "🧎" },
            { id: 5, title: 'انگشتر عقیق یمنی نقره', price: 1850000, old: 2200000, rating: 4.9, reviews: 2100, icon: "💍" },
            { id: 6, title: 'عطر عود کمپانی سوئیس', price: 2200000, old: 2500000, rating: 4.8, reviews: 320, icon: "🕌" },
            { id: 7, title: 'مهر نماز تربت کربلا', price: 85000, old: 100000, rating: 4.5, reviews: 780, icon: "🪨" },
            { id: 8, title: 'سجاده نماز مسافر', price: 550000, old: 600000, rating: 4.4, reviews: 150, icon: "🧶" },
            { id: 9, title: 'کتاب صحیفه سجادیه', price: 180000, old: 200000, rating: 4.7, reviews: 620, icon: "📗" },
            { id: 10, title: 'پرچم یا حسین (ع) مشکی', price: 120000, old: 150000, rating: 4.8, reviews: 910, icon: "🚩" }
        ];

        let cart = [];

        function formatPrice(price) { return new Intl.NumberFormat('fa-IR').format(price) + ' تومان'; }
        function toPersianDigits(n) { return n.toString().replace(/\d/g, x => '۰۱۲۳۴۵۶۷۸۹'[x]); }

        function renderProducts(items) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = items.map(p => {
                const discount = Math.round(((p.old - p.price) / p.old) * 100);
                const imgData = getImg(p.icon);
                return `
                    <div class="bg-white rounded-xl overflow-hidden hover:shadow-lg transition flex flex-col justify-between p-3 border border-gray-100 group">
                        <div>
                            <div class="relative aspect-square overflow-hidden rounded-lg bg-gray-50 mb-3">
                                <img src="${imgData}" alt="${p.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                                ${discount > 0 ? `<span class="absolute top-2 right-2 bg-dk-red text-white text-[10px] font-bold px-2 py-1 rounded">${toPersianDigits(discount)}٪</span>` : ''}
                            </div>
                            <h3 class="text-xs sm:text-sm font-semibold text-gray-800 line-clamp-2 h-10 leading-5">${p.title}</h3>
                            <div class="flex items-center gap-1 mt-2 text-xs text-gray-400">
                                <i class="fa-solid fa-star text-amber-400"></i>
                                <span>${toPersianDigits(p.rating)}</span>
                                <span>(${toPersianDigits(p.reviews)})</span>
                            </div>
                        </div>
                        <div class="mt-3">
                            ${p.old > p.price ? `<span class="text-xs text-gray-400 line-through block">${formatPrice(p.old)}</span>` : ''}
                            <span class="text-sm font-bold text-gray-800">${formatPrice(p.price)}</span>
                            <button onclick="addToCart(${p.id})" class="mt-2 w-full bg-[#f0f0f1] hover:bg-dk-red hover:text-white text-gray-700 font-semibold py-2 rounded-lg text-xs transition flex items-center justify-center gap-1">
                                <i class="fa-solid fa-cart-plus"></i> افزودن به سبد
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function handleSearch() {
            const q = document.getElementById('searchInput').value.trim().toLowerCase();
            const filtered = products.filter(p => p.title.toLowerCase().includes(q));
            renderProducts(filtered);
        }

        function toggleCartDrawer(open = null) {
            const drawer = document.getElementById('cartDrawer');
            const overlay = document.getElementById('cartOverlay');
            const panel = document.getElementById('cartPanel');
            const isOpening = open !== null ? open : drawer.classList.contains('invisible');

            if (isOpening) {
                drawer.classList.remove('invisible');
                setTimeout(() => {
                    overlay.classList.add('opacity-100');
                    panel.classList.remove('-translate-x-full');
                }, 10);
            } else {
                overlay.classList.remove('opacity-100');
                panel.classList.add('-translate-x-full');
                setTimeout(() => {
                    drawer.classList.add('invisible');
                }, 300);
            }
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const item = cart.find(c => c.id === id);
            if (item) item.quantity++;
            else cart.push({ ...product, quantity: 1 });
            updateCartUI();
            toggleCartDrawer(true);
        }

        function updateQuantity(id, change) {
            const item = cart.find(c => c.id === id);
            if (!item) return;
            item.quantity += change;
            if (item.quantity <= 0) cart = cart.filter(c => c.id !== id);
            updateCartUI();
        }

        function updateCartUI() {
            const badge = document.getElementById('cartBadge');
            const cartItemsContainer = document.getElementById('cartItems');
            const totalPriceEl = document.getElementById('cartTotalPrice');
            const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

            if (totalCount > 0) {
                badge.textContent = toPersianDigits(totalCount);
                badge.classList.remove('hidden');
                badge.classList.add('flex');
            } else {
                badge.classList.add('hidden');
            }
            totalPriceEl.textContent = formatPrice(totalPrice);

            if (cart.length === 0) {
                cartItemsContainer.innerHTML = `<div class="text-center text-gray-400 py-10"><i class="fa-solid fa-cart-shopping text-4xl mb-2 opacity-50"></i><br>سبد خرید خالی است.</div>`;
                return;
            }

            cartItemsContainer.innerHTML = cart.map(item => `
                <div class="flex gap-3 items-center">
                    <div class="w-12 h-12 rounded-lg flex items-center justify-center bg-gray-100 text-2xl">${item.icon}</div>
                    <div class="flex-1">
                        <p class="text-xs font-bold line-clamp-1">${item.title}</p>
                        <span class="text-xs text-gray-500">${formatPrice(item.price)}</span>
                    </div>
                    <div class="flex items-center gap-2 bg-gray-100 rounded-lg p-1">
                        <button onclick="updateQuantity(${item.id}, 1)" class="text-dk-red font-bold w-5">+</button>
                        <span class="text-xs font-bold">${toPersianDigits(item.quantity)}</span>
                        <button onclick="updateQuantity(${item.id}, -1)" class="text-gray-500 w-5">-</button>
                    </div>
                </div>
            `).join('');
        }

        function checkout() {
            if (cart.length === 0) return alert('سبد خرید شما خالی است!');
            alert('سفارش شما با موفقیت ثبت شد.');
            cart = [];
            updateCartUI();
            toggleCartDrawer(false);
        }

        // ثبت‌نام
        function openRegisterModal() {
            document.getElementById('registerModal').classList.remove('hidden');
            setTimeout(() => document.getElementById('phoneInput').focus(), 100);
        }

        function closeRegisterModal() {
            document.getElementById('registerModal').classList.add('hidden');
        }

        function handleRegister(e) {
            e.preventDefault();
            const phone = document.getElementById('phoneInput').value;
            if(phone.length < 10) {
                alert('لطفا شماره موبایل معتبر وارد کنید.');
                return;
            }
            alert(`کد تایید برای شماره ${phone} پیامک شد (نمونه).`);
            closeRegisterModal();
            document.getElementById('phoneInput').value = '';
        }

        renderProducts(products);
    </script>
</body>
</html>
